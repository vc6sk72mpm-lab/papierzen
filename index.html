function pickBackup(){const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;const msg=document.querySelector('#backupMsg');try{if(f.size>80*1048576)throw new Error('Fichier trop volumineux (80 Mo maximum).');confirmRestore(parseBackup(await f.text()))}catch(e){if(msg)msg.textContent=e.message}};inp.click()}
function confirmRestore(o){pendingBackup=o;const d=o.data,when=o.exportedAt?new Date(o.exportedAt).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}):'date inconnue';show(`<h2>Restaurer cette sauvegarde ?</h2><p>Sauvegarde du ${esc(when)} : ${d.docs.length} document${d.docs.length>1?'s':''}, ${d.insurances.length} assurance${d.insurances.length>1?'s':''}, ${d.events.length} échéance${d.events.length>1?'s':''}, ${d.appointments.length} rendez-vous.</p><div class="tip"><strong>Vos données actuelles seront remplacées.</strong><p>Pensez à exporter d’abord si vous voulez les garder.</p></div><button class="primary" onclick="restoreBackup()">Restaurer</button><button class="link" style="width:100%;padding:16px" onclick="modal.close()">Annuler</button>`)}
async function restoreBackup(){const o=pendingBackup;if(!o)return;try{for(const at of allAtts())await fileDel(at.id);const files=o.files||{};for(const id of Object.keys(files)){const f=files[id];if(!f||typeof f.data!=='string'||!f.data.startsWith('data:'))continue;const blob=dataURLToBlob(f.data);await putFile(id,blob)}const d=o.data;docs=d.docs;payslips=d.payslips;events=d.events;credits=d.credits;savings=d.savings;appointments=d.appointments;insurances=d.insurances;bankDemo=!!d.bankDemo;needSeedIns=false;ensureInsEvents();pendingBackup=null;modal.close();render();toast('Sauvegarde restaurée')}catch(e){toast('Restauration impossible : '+e.message)}}

const DBN='papierzen-files',MAXMB=10;let dbp=null,previewUrl=null;
function db(){if(!dbp)dbp=new Promise((res,rej)=>{try{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return dbp}
function idb(mode,fn){return db().then(d=>new Promise((res,rej)=>{const t=d.transaction('files',mode),r=fn(t.objectStore('files'));t.oncomplete=()=>res(r&&r.result);t.onerror=t.onabort=()=>rej(t.error)}))}
const rawGet=id=>idb('readonly',s=>s.get(id));
const fileGet=id=>rawGet(id).then(v=>openStored(id,v));
const putFile=(id,blob)=>sealBlob(id,blob).then(v=>idb('readwrite',s=>s.put(v,id)));
const fileDel=id=>idb('readwrite',s=>s.delete(id)).catch(()=>{});
function fileIcon(m){return m&&m.type==='application/pdf'?'▤':'▣'}
function sizeLabel(n){return n>1048576?(n/1048576).toFixed(1).replace('.',',')+' Mo':Math.max(1,Math.round(n/1024))+' Ko'}
async function shrinkImage(file){if(!/^image\/(jpeg|png|webp)$/.test(file.type))return file;try{const bmp=await createImageBitmap(file),sc=Math.min(1,1800/Math.max(bmp.width,bmp.height));if(sc===1&&file.size<1.5e6)return file;const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));return b&&b.size<file.size?b:file}catch(e){return file}}
async function storeFile(file){const isPdf=file.type==='application/pdf'||/\.pdf$/i.test(file.name||''),isImg=/^image\//.test(file.type);if(!isPdf&&!isImg)throw new Error('Format non pris en charge : choisissez une photo ou un PDF.');if(file.size>MAXMB*1048576)throw new Error('Fichier trop lourd (maximum '+MAXMB+' Mo).');const blob=isPdf?file:await shrinkImage(file),type=isPdf?'application/pdf':(blob.type||file.type),id='f'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);try{await putFile(id,blob)}catch(e){throw new Error('Enregistrement impossible sur cet appareil (navigation privée ou stockage plein).')}return {id,name:file.name||'document',type,size:blob.size}}
function revokePreview(){if(previewUrl){URL.revokeObjectURL(previewUrl);previewUrl=null}}
modal.addEventListener('close',revokePreview);
function attachmentBlock(){return '<div id="attach"><p class="finance-note">Chargement du fichier…</p></div>'}
async function fillAttachment(meta){const box=document.querySelector('#attach');if(!box)return;try{const blob=await fileGet(meta.id);if(!blob){box.innerHTML='<p class="finance-note">Fichier introuvable sur cet appareil.</p>';return}revokePreview();previewUrl=URL.createObjectURL(blob);const dl=`<a class="chip active" style="flex:1;text-align:center;text-decoration:none" href="${previewUrl}" download="${esc(meta.name)}">⇩ Télécharger</a>`;if(meta.type==='application/pdf'){box.innerHTML=`<div class="tip"><strong>▤ ${esc(meta.name)}</strong><p>PDF · ${sizeLabel(meta.size)}</p></div><div class="finance-actions" style="margin-top:12px"><a class="chip active" style="flex:1;text-align:center;text-decoration:none" href="${previewUrl}" target="_blank" rel="noopener">Ouvrir le PDF</a>${dl}</div>`}else{box.innerHTML=`<img alt="${esc(meta.name)}" src="${previewUrl}" style="width:100%;max-height:50vh;object-fit:contain;border-radius:14px;background:var(--soft);margin-top:14px"><p class="finance-note">${esc(meta.name)} · ${sizeLabel(meta.size)}</p><div class="finance-actions">${dl}</div>`;const im=box.querySelector('img');im.onerror=()=>{im.replaceWith(Object.assign(document.createElement('p'),{className:'finance-note',textContent:'Aperçu indisponible pour ce format : utilisez Télécharger.'}))}}}catch(e){box.innerHTML='<p class="finance-note">Impossible de lire le fichier.</p>'}}
function attachControls(kind,i,has){return has?`<button class="link" style="width:100%;padding:12px" onclick="pickAttach('${kind}',${i})">Remplacer le fichier</button><button class="link" style="width:100%;padding:8px" onclick="removeAttach('${kind}',${i})">Retirer le fichier</button>`:`<button class="primary" style="margin-top:14px;background:var(--pine2)" onclick="pickAttach('${kind}',${i})">+ Joindre une photo ou un PDF</button>`}
function pickAttach(kind,i){const inp=document.createElement('input');inp.type='file';inp.accept='image/*,application/pdf';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;try{const meta=await storeFile(f),t=({doc:docs,pay:payslips,ins:insurances})[kind][i];if(t.att)await fileDel(t.att.id);t.att=meta;if(kind==='doc')t.icon=fileIcon(meta);modal.close();render();toast('Fichier joint');({doc:docDetail,pay:payDetail,ins:insDetail})[kind](i)}catch(e){toast(e.message)}};inp.click()}
async function removeAttach(kind,i){const t=({doc:docs,pay:payslips,ins:insurances})[kind][i];if(t.att)await fileDel(t.att.id);t.att=null;if(kind==='doc')t.icon='▤';modal.close();render();toast('Fichier retiré')}
async function doReset(){try{localStorage.removeItem(KEY)}catch(e){}try{if(dbp)(await dbp).close()}catch(e){}try{await new Promise(r=>{const q=indexedDB.deleteDatabase(DBN);q.onsuccess=q.onerror=q.onblocked=()=>r()})}catch(e){}location.reload()}
function resetDemo(){show(`<h2>Réinitialiser la démo ?</h2><p>Toutes vos saisies et tous les fichiers importés sur cet appareil seront effacés et les exemples d’origine reviendront.</p><button class="primary" onclick="doReset()">Tout réinitialiser</button><button class="link" style="width:100%;padding:16px" onclick="modal.close()">Annuler</button>`)}
function docDetail(i){const d=docs[i];show(`<span class="eyebrow">${esc(d.cat)}</span><h2 style="margin-top:18px">${esc(d.name)}</h2><p>${esc(d.sub)}</p><div class="tip">${d.date?'Date associée : '+dateFR(d.date):'Aucune échéance associée'}</div>${d.att?attachmentBlock():'<p>Aucun fichier joint à cette fiche.</p>'}${attachControls('doc',i,!!d.att)}<button class="primary" onclick="modal.close();go('dates')">Consulter mes échéances</button><button class="link" style="width:100%;padding:18px" onclick="modal.close();deleteDoc(${i})">Supprimer cette fiche</button>`);if(d.att)fillAttachment(d.att)}
function deleteDoc(i){show(`<h2>Supprimer ce document ?</h2><p>${esc(docs[i].name)}${docs[i].att?' et son fichier joint':''}</p><button class="primary" onclick="removeDoc(${i})">Confirmer la suppression</button><button class="link" style="width:100%;padding:16px" onclick="modal.close()">Annuler</button>`)}
function removeDoc(i){const f=docs[i].att;if(f)fileDel(f.id);docs.splice(i,1);modal.close();render();toast('Document supprimé')}
function delPay(i){const f=payslips[i].att;if(f)fileDel(f.id);payslips.splice(i,1);modal.close();render();toast('Fiche supprimée')}

function eventDetail(i){const e=events[i];show(`<span class="eyebrow">ÉCHÉANCE</span><h2 style="margin-top:16px">${esc(e.name)}</h2><p>${esc(e.sub)}${e.sub?' · ':''}${dateFR(e.date)} · ${e.done?'Terminé':dueLabel(e.date)}</p><label>Me rappeler avant l’échéance<select id="delay">${REMINDS.map(r=>`<option ${r===e.remind?'selected':''}>${r}</option>`).join('')}</select></label><p>Notifications simulées dans cette maquette.</p><button class="primary" onclick="events[${i}].remind=document.querySelector('#delay').value;persist();toast('Rappel enregistré (simulation)');modal.close()">Tester le rappel</button><button class="link" style="width:100%;padding:16px" onclick="events[${i}].done=!events[${i}].done;modal.close();render()">${e.done?'Remettre à venir':'Marquer comme terminé'}</button><button class="link" style="width:100%;padding:12px" onclick="modal.close();editEvent(${i})">Modifier</button><button class="link" style="width:100%;padding:12px" onclick="modal.close();deleteEvent(${i})">Supprimer</button>`)}
function editEvent(i){const back=page==='calendar'?'calendar':'dates';const e=events[i]||{name:'',sub:'',date:page==='calendar'?selectedDay:localDate(new Date()),icon:'◇',done:false,remind:REMINDS[0]};show(`<span class="eyebrow">MES ÉCHÉANCES</span><h2 style="margin-top:16px">${i===undefined?'Nouvelle échéance':'Modifier l’échéance'}</h2><form id="eventForm"><label>Intitulé<input name="name" required maxlength="70" value="${esc(e.name)}" placeholder="Ex. Vidange, renouvellement mutuelle…"></label><label>Détail (facultatif)<input name="sub" maxlength="90" value="${esc(e.sub)}" placeholder="Ex. Peugeot 206+"></label><label>Date<input type="date" name="date" required value="${e.date}"></label><label>Me rappeler<select name="remind">${REMINDS.map(r=>`<option ${r===e.remind?'selected':''}>${r}</option>`).join('')}</select></label><p class="finance-note">Rappels simulés dans cette maquette.</p><button class="primary">Enregistrer</button></form>`);document.querySelector('#eventForm').onsubmit=ev=>{ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target));f.name=f.name.trim();if(!f.name)return;const item={...e,name:f.name,sub:f.sub.trim(),date:f.date,remind:f.remind};if(i===undefined)events.push(item);else events[i]=item;if(back==='calendar'){selectedDay=item.date;calendarMonth=item.date.slice(0,7)}modal.close();go(back);toast('Échéance enregistrée')}}
function deleteEvent(i){show(`<h2>Supprimer cette échéance ?</h2><p>${esc(events[i].name)}</p><button class="primary" onclick="events.splice(${i},1);modal.close();render();toast('Échéance supprimée')">Confirmer la suppression</button><button class="link" style="width:100%;padding:16px" onclick="modal.close()">Annuler</button>`)}
function vehicleDetail(){show('<span class="eyebrow">VÉHICULE FAMILIAL</span><h2 style="margin-top:16px">Volkswagen Touran</h2><p>Diesel · 2013</p><div class="tip">Prochain contrôle technique<br><strong>18 juin 2027</strong></div><p>Entretien à planifier. Les informations sont des exemples.</p><button class="primary" onclick="modal.close();filter=\'Véhicules\';go(\'docs\')">Voir les documents véhicules</button>')}

function addDoc(){if(page==='insurance'){editIns();return}if(page==='calendar'){editAppointment();return}if(page==='finance'){if(financeTab==='savings')editSaving();else if(financeTab==='credits')editCredit();else connectBank();return}if(page==='pay'){addPay();return}if(page==='dates'){editEvent();return}
show(`<span class="eyebrow">UN PAPIER EN MOINS À CHERCHER</span><h2 style="margin-top:16px">Ajouter un document</h2><p>Ajoutez un document avec, si vous voulez, sa photo ou son PDF. Le fichier reste enregistré uniquement sur cet appareil, il n’est envoyé nulle part.</p><form id="form"><label>Nom du document<input required maxlength="70" name="title" placeholder="Ex. Facture du réfrigérateur"></label><label>Catégorie<select name="cat"><option>Garanties</option><option>Maison</option><option>Véhicules</option><option>Fiches de paie</option></select></label><label>Date d’échéance (facultatif)<input name="date" type="date"></label><label>Photo ou PDF du document (facultatif)<input type="file" name="file" accept="image/*,application/pdf"></label><label>Prendre en photo (facultatif)<input type="file" name="photo" accept="image/*" capture="environment"></label><p id="fileError" role="alert" style="color:var(--red)"></p><button class="primary">Ajouter le document</button></form>`);
document.querySelector('#form select').onchange=e=>{if(e.target.value==='Fiches de paie'){modal.close();addPay()}};
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),title=f.get('title').trim();if(!title)return;const err=document.querySelector('#fileError'),btn=e.target.querySelector('button');err.textContent='';btn.disabled=true;let meta=null;const chosen=[f.get('file'),f.get('photo')].find(x=>x&&x.size>0);if(chosen){try{meta=await storeFile(chosen)}catch(ex){err.textContent=ex.message;btn.disabled=false;return}}docs.unshift({name:title,cat:f.get('cat'),date:f.get('date'),sub:(meta?(meta.type==='application/pdf'?'PDF ajouté':'Photo ajoutée'):'Document ajouté')+' · '+dateFR(localDate(new Date())),icon:meta?fileIcon(meta):'▤',att:meta});if(f.get('date'))events.push({name:title,sub:'Document · '+f.get('cat'),date:f.get('date'),icon:'▤',done:false,remind:REMINDS[0]});modal.close();filter='Tout';go('docs');toast('Votre fiche de démonstration a été ajoutée')}}

function renderPay(){const years=[...new Set(payslips.map(p=>p.month.slice(0,4)))].sort().reverse();app.innerHTML=head('Mes fiches de paie','Vos bulletins de salaire, faciles à retrouver.')+`<button class="link" style="padding:18px 0" onclick="go('docs')">← Mes documents</button><div class="tip"><strong>Un espace pour votre vie professionnelle</strong><p>Maquette : utilisez des informations fictives. Vous pouvez joindre un PDF ou une photo ; ils restent enregistrés uniquement sur cet appareil.</p></div><button class="primary" onclick="addPay()">+ Ajouter une fiche de paie</button><label for="payyear">Année</label><select id="payyear" class="search" style="margin-top:8px" onchange="payYear=this.value;render()"><option>Toutes</option>${years.map(y=>`<option ${payYear===y?'selected':''}>${y}</option>`).join('')}</select><div class="sectionhead"><h2>Mes bulletins</h2><span class="eyebrow">DÉMONSTRATION</span></div>`;const shown=payslips.map((p,i)=>({p,i})).filter(({p})=>payYear==='Toutes'||p.month.startsWith(payYear)).sort((a,b)=>b.p.month.localeCompare(a.p.month));app.insertAdjacentHTML('beforeend',shown.map(({p,i})=>`<button class="row" onclick="payDetail(${i})"><span class="icon purple">▤</span><span class="grow"><strong>${esc(monthLabel(p.month))}</strong><small>${esc(p.employer)}</small></span><span class="chev">›</span></button>`).join('')||'<p class="empty">Aucun bulletin pour cette année. Ajoutez votre première fiche.</p>')}
function addPay(){show(`<span class="eyebrow">VIE PROFESSIONNELLE</span><h2 style="margin-top:16px">Ajouter une fiche de paie</h2><p>Joignez votre bulletin en PDF ou en photo. Le fichier reste enregistré uniquement sur cet appareil, il n’est envoyé nulle part.</p><form id="payform"><label>Mois du bulletin<input required type="month" name="month" value="${localDate(new Date()).slice(0,7)}"></label><label>Employeur<input required maxlength="80" name="employer" placeholder="Ex. Entreprise exemple"></label><label>PDF ou photo du bulletin (facultatif)<input type="file" name="file" accept="application/pdf,image/*"></label><label>Prendre en photo (facultatif)<input type="file" name="photo" accept="image/*" capture="environment"></label><p id="fileError" role="alert" style="color:var(--red)"></p><button class="primary">Ajouter la fiche de paie</button></form>`);document.querySelector('#payform').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),employer=f.get('employer').trim();if(!employer)return;const err=document.querySelector('#fileError'),btn=e.target.querySelector('button');err.textContent='';btn.disabled=true;let meta=null;const chosen=[f.get('file'),f.get('photo')].find(x=>x&&x.size>0);if(chosen){try{meta=await storeFile(chosen)}catch(ex){err.textContent=ex.message;btn.disabled=false;return}}payslips.push({month:f.get('month'),employer,file:meta?meta.name:'Bulletin-'+f.get('month')+'.pdf',att:meta});modal.close();payYear='Toutes';go('pay');toast('Fiche de paie ajoutée')}}
function payDetail(i){const p=payslips[i];show(`<span class="eyebrow">FICHE DE PAIE</span><h2 style="margin-top:16px">${esc(monthLabel(p.month))}</h2><p>${esc(p.employer)}</p>${p.att?attachmentBlock():`<div class="tip"><strong>Aucun fichier joint</strong><p style="overflow-wrap:anywhere">${esc(p.file)}</p></div>`}${attachControls('pay',i,!!p.att)}<button class="primary" onclick="modal.close()">Retour à mes bulletins</button><button class="link" style="width:100%;padding:18px" onclick="delPay(${i})">Supprimer cette fiche</button>`);if(p.att)fillAttachment(p.att)}

function financeTabs(){return `<div class="chips" style="margin-top:24px"><button class="chip ${financeTab==='budget'?'active':''}" onclick="financeTab='budget';render()">Mon budget</button><button class="chip ${financeTab==='credits'?'active':''}" onclick="financeTab='credits';render()">Mes crédits</button><button class="chip ${financeTab==='savings'?'active':''}" onclick="financeTab='savings';render()">Mon épargne</button></div>`}
function renderFinance(){if(financeTab==='savings')renderSavings();else if(financeTab==='credits')renderCredits();else renderBudget()}
function defaultScheduleMonth(){const a=credits.filter(c=>c.balance>0).map(c=>c.next.slice(0,7)).sort();return a[0]||localDate(new Date()).slice(0,7)}
function renderCredits(){const active=credits.filter(c=>c.balance>0),total=credits.reduce((s,c)=>s+c.balance,0),monthly=active.reduce((s,c)=>s+c.payment,0),dm=defaultScheduleMonth();app.innerHTML=head('Mes finances','Une vue claire sur vos crédits et vos échéances.')+financeTabs()+`<div class="tip"><strong>Vos crédits, en un coup d’œil</strong><p>Exemples fictifs. Saisie manuelle, sans connexion bancaire. Enregistré sur cet appareil.</p></div><div class="stats finance-stats" style="margin-top:22px"><div class="stat"><span>Capital restant à rembourser</span><strong style="margin-top:10px">${euros(total)}</strong><span>Hors intérêts et assurance à venir</span></div><div class="stat"><span>Mensualités cumulées</span><strong style="margin-top:10px">${euros(monthly)}</strong><span>par mois</span></div><div class="stat"><span>Crédits en cours</span><strong style="margin-top:10px">${String(active.length).padStart(2,'0')}</strong><span>à suivre au même endroit</span></div></div><div class="sectionhead"><h2>Mes crédits</h2><button class="chip active" onclick="editCredit()">+ Ajouter</button></div><div class="columns"><section>${credits.map((c,i)=>{const pct=Math.max(0,Math.min(100,(1-c.balance/c.initial)*100));return `<article class="credit-card"><button class="row" onclick="creditDetail(${i})"><span class="icon ${i%2?'purple':'amber'}">€</span><span class="grow"><strong>${esc(c.name)}</strong><small>${esc(c.bank)}</small></span><span class="chev">›</span></button><div class="sectionhead" style="margin-top:24px"><div><div class="eyebrow">RESTE À REMBOURSER</div><h2 style="margin-top:8px">${euros(c.balance)}</h2></div><div style="text-align:right"><strong>${euros(c.balance>0?c.payment:0)}</strong><small style="display:block;color:var(--muted);margin-top:6px">/ mois</small></div></div><div class="credit-progress" role="progressbar" aria-label="Capital remboursé" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}"><span style="width:${pct}%"></span></div><p class="finance-note">${Math.round(pct)} % remboursés · Montant initial ${euros(c.initial)}</p><p class="finance-note">${c.balance>0?'Prochaine échéance : '+dateFR(c.next):'Crédit soldé ✓'}</p><button class="link" style="padding:8px 0" onclick="creditDetail(${i})">Voir le détail →</button></article>`}).join('')||'<div class="empty">Aucun crédit. Ajoutez votre première fiche.</div>'}</section><section><div class="sectionhead"><h2>Prochaines échéances</h2></div><label for="financeMonth">Mois à consulter</label><input id="financeMonth" class="search" style="margin-top:8px" type="month" value="${dm}" onchange="renderSchedule(this.value)"><div id="financeSchedule"></div><div class="tip"><strong>Le solde de référence</strong><p>Reportez le capital restant dû indiqué sur votre dernier relevé bancaire. Une mensualité inclut parfois des intérêts et une assurance : elle ne réduit pas intégralement le capital.</p></div></section></div>`;renderSchedule(dm)}
function renderSchedule(month){const target=document.querySelector('#financeSchedule');if(!target)return;if(!/^\d{4}-\d{2}$/.test(month)){target.innerHTML='<p>Sélectionnez un mois.</p>';return}const [y,m]=month.split('-').map(Number);const items=credits.filter(c=>c.balance>0&&month>=c.next.slice(0,7)&&month<=c.end.slice(0,7)).map(c=>{const day=Math.min(Number(c.next.slice(8)),new Date(y,m,0).getDate());return {c,date:month+'-'+String(day).padStart(2,'0')}}).filter(x=>x.date<=x.c.end).sort((a,b)=>a.date.localeCompare(b.date));target.innerHTML=`<p class="finance-note">Échéances mensuelles prévues · ${euros(items.reduce((s,x)=>s+x.c.payment,0))}</p>`+items.map(({c,date})=>`<div class="schedule"><time datetime="${date}">${esc(dateFR(date).replace(/ \d{4}$/,''))}</time><div class="grow"><strong>${esc(c.name)}</strong><small>${esc(c.bank)}</small></div><strong>${euros(c.payment)}</strong></div>`).join('')+(items.length?'':'<p class="empty">Aucune échéance prévue pour ce mois.</p>')+'<p class="finance-note">Projection à mensualité constante selon les dates saisies. Dernière échéance à confirmer sur votre relevé.</p>'}
function creditDetail(i){const c=credits[i];show(`<span class="eyebrow">MON CRÉDIT</span><h2 style="margin-top:16px">${esc(c.name)}</h2><p>${esc(c.bank)}</p><div class="tip"><span>Capital restant dû</span><h2 style="font-size:30px;margin-top:10px">${euros(c.balance)}</h2></div><p>Montant emprunté : <strong>${euros(c.initial)}</strong><br>Mensualité : <strong>${euros(c.payment)}</strong><br>Prochaine échéance : <strong>${dateFR(c.next)}</strong><br>Fin prévue : <strong>${dateFR(c.end)}</strong></p><p>Solde saisi manuellement. Aucun prélèvement ni mise à jour bancaire automatique.</p><button class="primary" onclick="modal.close();editCredit(${i})">Modifier le crédit / actualiser le solde</button><button class="link" style="width:100%;padding:18px" onclick="modal.close();removeCredit(${i})">Supprimer cette fiche</button>`)}
function removeCredit(i){show(`<h2>Supprimer ce crédit ?</h2><p>La fiche « ${esc(credits[i].name)} » sera retirée.</p><button class="primary" onclick="credits.splice(${i},1);modal.close();render()">Confirmer la suppression</button><button class="link" style="width:100%;padding:16px" onclick="modal.close()">Annuler</button>`)}
function editCredit(i){const c=credits[i]||{name:'',bank:'',initial:'',balance:'',payment:'',next:localDate(new Date()),end:''};show(`<span class="eyebrow">MES FINANCES</span><h2 style="margin-top:16px">${i===undefined?'Ajouter un crédit':'Modifier le crédit'}</h2><p>Utilisez des données fictives pour tester la maquette.</p><form id="creditForm"><label>Nom du crédit<input name="name" required maxlength="70" value="${esc(c.name)}" placeholder="Ex. Crédit auto"></label><label>Banque ou organisme<input name="bank" required maxlength="70" value="${esc(c.bank)}"></label><div class="finance-grid"><label>Montant emprunté (€)<input name="initial" required type="number" min="0.01" max="100000000" step="0.01" value="${c.initial}"></label><label>Capital restant dû (€)<input name="balance" required type="number" min="0" max="100000000" step="0.01" value="${c.balance}"></label><label>Mensualité totale (€)<input name="payment" required type="number" min="0.01" max="100000000" step="0.01" value="${c.payment}"></label><label>Prochaine échéance<input name="next" required type="date" value="${c.next}"></label><label>Date de fin prévue<input name="end" required type="date" value="${c.end}"></label></div><p id="creditError" role="alert" style="color:var(--red)"></p><button class="primary">Enregistrer la fiche</button></form>`);document.querySelector('#creditForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const n={name:f.get('name').trim(),bank:f.get('bank').trim(),initial:Number(f.get('initial')),balance:Number(f.get('balance')),payment:Number(f.get('payment')),next:f.get('next'),end:f.get('end')};const error=!n.name||!n.bank?'Renseignez le nom et l’organisme.':n.balance>n.initial?'Le capital restant dû ne peut pas dépasser le montant emprunté.':n.end<n.next?'La date de fin doit être égale ou postérieure à la prochaine échéance.':'';if(error){document.querySelector('#creditError').textContent=error;return}if(i===undefined)credits.push(n);else credits[i]=n;modal.close();financeTab='credits';go('finance');toast('Crédit enregistré')}}

function connectBank(){show(`<span class="eyebrow">CONNEXION • DÉMONSTRATION</span><h2 style="margin-top:18px">Connecter ma banque</h2><p>Découvrez le parcours avec une banque fictive. Aucune connexion réelle et aucun identifiant bancaire demandé.</p><form id="bankForm"><label>Banque de démonstration<select><option>Banque exemple</option></select></label><div class="tip"><strong>Ce que vous pourrez suivre</strong><p>Soldes, opérations et catégories de dépenses. La future connexion nécessitera votre accord auprès d’un prestataire sécurisé.</p></div><label style="display:flex;gap:10px;align-items:start"><input type="checkbox" required style="width:auto;margin:0">Je souhaite afficher des comptes et opérations fictifs pour tester le budget.</label><button class="primary">Activer la démonstration</button></form>`);document.querySelector('#bankForm').onsubmit=e=>{e.preventDefault();bankDemo=true;modal.close();render();toast('Démonstration activée • aucune banque connectée')}}
function disconnectBank(){bankDemo=false;transactionFilter='Tout';render();toast('Comptes fictifs retirés de la vue')}
function renderBudget(){app.innerHTML=head('Mon budget','Un regard serein sur votre quotidien.')+financeTabs()+`<div class="tip"><strong>Maquette • Données entièrement fictives</strong><p>Exemple de mois type. Aucune synchronisation bancaire réelle. Les réglages sont enregistrés sur cet appareil.</p></div>`;
if(!bankDemo){app.insertAdjacentHTML('beforeend',`<section class="hero"><div><div class="eyebrow">VOTRE BUDGET, PLUS SIMPLE</div><h2>Tout voir. Mieux prévoir.</h2><p>Vos comptes, vos dépenses et ce qu’il vous reste avant le prochain salaire.</p></div></section><button class="primary" onclick="connectBank()">Connecter ma banque</button><p style="text-align:center">Parcours de démonstration · Aucun identifiant demandé</p><div class="columns"><div class="tip"><strong>Vos dépenses classées</strong><p>Courses, transport, maison et loisirs, réunis dans une vue claire.</p></div><div class="tip"><strong>Les prochaines sorties d’argent</strong><p>Anticipez les abonnements et prélèvements avant votre prochain salaire.</p></div></div>`);return}
const income=transactions.filter(t=>t.amount>0).reduce((a,t)=>a+t.amount,0),spent=-transactions.filter(t=>t.amount<0).reduce((a,t)=>a+t.amount,0),balance=500+income-spent,pending=upcoming.reduce((a,t)=>a+t.amount,0);
app.insertAdjacentHTML('beforeend',`<div class="row"><span class="icon">▱</span><div class="grow"><strong>Banque exemple</strong><small>Démonstration active · Aucune banque connectée</small></div><button class="link" onclick="disconnectBank()">Retirer</button></div><section class="hero"><div><div class="eyebrow">DISPONIBLE AVANT LE PROCHAIN SALAIRE</div><h2 style="font-size:36px">${euros(balance-pending)}</h2><p>Estimation fictive<br>Solde ${euros(balance)} − prélèvements prévus ${euros(pending)}</p></div></section><p class="finance-note">Hors achats futurs non prévus. Le solde inclut 500 € présents au début du mois. L’épargne est exclue du disponible.</p><div class="stats"><div class="stat"><span>Revenus du mois</span><strong>${euros(income)}</strong></div><div class="stat"><span>Dépenses du mois</span><strong>${euros(spent)}</strong></div><button class="stat" onclick="financeTab='savings';render()"><span>Mon épargne fictive →</span><strong>${euros(savings.reduce((sum,a)=>sum+a.balance,0))}</strong></button></div><div class="columns"><section><h2>Dépenses par catégorie</h2>${[['Crédits',1395,1500],['Courses',420,450],['Transport',120,200],['Loisirs',180,200],['Maison',95,150],['Abonnements',30,60]].map(([cat,amount,limit])=>`<article class="credit-card"><div class="sectionhead"><strong>${cat}</strong><span>${euros(amount)} / ${euros(limit)}</span></div><div class="credit-progress"><span style="width:${Math.min(100,amount/limit*100)}%;background:${amount/limit>=.9?'var(--amber)':'var(--leaf)'}"></span></div><small>${Math.round(amount/limit*100)} % du budget mensuel fictif</small></article>`).join('')}</section><section><h2>À anticiper</h2><div class="tip"><strong>Courses : 93 % du budget utilisé</strong><p>Il reste 30 € sur votre enveloppe de 450 €. Alerte affichée uniquement dans la maquette.</p></div><h2 style="margin-top:28px">Prélèvements à venir</h2>${upcoming.map(t=>`<div class="schedule"><div class="grow"><strong>${t.name}</strong><small>${t.date} · Prévision fictive</small></div><strong>${euros(t.amount)}</strong></div>`).join('')}<button class="primary" onclick="financeTab='credits';render()">Consulter mes crédits</button><p class="finance-note">Le capital restant dû se renseigne manuellement dans Mes crédits.</p></section></div><h2 style="margin-top:28px">Opérations du mois</h2><label for="transactionFilter">Filtrer les opérations</label><select id="transactionFilter" class="search" style="margin-top:8px" onchange="transactionFilter=this.value;renderTransactions()">${['Tout',...new Set(transactions.map(t=>t.category))].map(c=>`<option ${transactionFilter===c?'selected':''}>${c}</option>`).join('')}</select><div id="transactions"></div>`);renderTransactions()}
function renderTransactions(){document.querySelector('#transactions').innerHTML=transactions.filter(t=>transactionFilter==='Tout'||t.category===transactionFilter).map(t=>`<div class="row"><div class="grow"><strong>${t.name}</strong><small>${t.date} · ${t.category}</small></div><strong>${t.amount>0?'+':''}${euros(t.amount)}</strong></div>`).join('')}

function renderSavings(){const total=savings.reduce((s,a)=>s+a.balance,0),monthly=savings.reduce((s,a)=>s+a.monthly,0);app.innerHTML=head('Mon épargne','Un peu aujourd’hui, de beaux projets demain.')+financeTabs()+`<div class="tip"><strong>Votre épargne, à votre rythme</strong><p>Données fictives · Saisie manuelle, sans connexion bancaire. Enregistré sur cet appareil. Aucun virement réel n’est effectué.</p></div><section class="hero"><div><div class="eyebrow">TOTAL MIS DE CÔTÉ</div><h2 style="font-size:36px">${euros(total)}</h2><p>${savings.length} enveloppe${savings.length>1?'s':''} d’épargne · Hors budget disponible</p></div><div class="art" aria-hidden="true">✧</div></section><div class="stats finance-stats"><div class="stat"><span>Versements mensuels prévus</span><strong style="margin-top:10px">${euros(monthly)}</strong><span>À titre indicatif · Non automatiques</span></div><div class="stat"><span>Objectifs atteints</span><strong style="margin-top:10px">${savings.filter(a=>a.balance>=a.target).length} / ${savings.length}</strong><span>Chaque pas compte</span></div></div><div class="sectionhead"><h2>Mes comptes et projets</h2><button class="chip active" onclick="editSaving()">+ Ajouter</button></div><div class="columns">${savings.map((a,i)=>{const pct=Math.min(100,a.balance/a.target*100),remaining=Math.max(0,a.target-a.balance);return `<article class="credit-card"><div class="row"><span class="icon purple">✧</span><div class="grow"><strong>${esc(a.name)}</strong><small>${esc(a.type)}</small></div></div><div class="sectionhead" style="margin-top:22px"><h2>${euros(a.balance)}</h2><span class="pill">${Math.floor(pct)} %</span></div><p>Objectif : ${euros(a.target)}</p><div class="credit-progress" role="progressbar" aria-label="${esc(a.name)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.floor(pct)}"><span style="width:${pct}%"></span></div><p class="finance-note">${remaining?`Encore ${euros(remaining)} à mettre de côté`:'Objectif atteint ✓'}<br>${euros(a.monthly)} / mois prévus${remaining&&a.monthly?` · Environ ${Math.ceil(remaining/a.monthly)} mois restants`:''}</p><div class="finance-actions"><button class="chip active" onclick="savingMovement(${i})">+ / − Mouvement</button><button class="chip" onclick="editSaving(${i})">Modifier</button></div></article>`}).join('')||'<p class="empty">Ajoutez une première enveloppe pour préparer votre prochain projet.</p>'}</div><div class="tip"><strong>Un objectif pour chaque envie</strong><p>Précaution, vacances ou nouvel achat : répartissez votre épargne en enveloppes, sans compter deux fois le même solde. La durée estimée suppose des versements constants, sans intérêts ni retraits.</p></div>`}
function editSaving(i){const a=savings[i]||{name:'',type:'Livret A',balance:'',target:'',monthly:0};show(`<span class="eyebrow">MON ÉPARGNE</span><h2 style="margin-top:16px">${i===undefined?'Ajouter une enveloppe':'Modifier mon épargne'}</h2><p>Renseignez des montants fictifs pour tester votre objectif.</p><form id="savingForm"><label>Nom du projet ou du compte<input name="name" required maxlength="70" value="${esc(a.name)}" placeholder="Ex. Vacances en famille"></label><label>Support d’épargne<input name="type" required maxlength="60" value="${esc(a.type)}" placeholder="Ex. Livret A, LDDS, PEL…"></label><label>Montant déjà épargné (€)<input name="balance" type="number" min="0" max="100000000" step="0.01" required value="${a.balance}"></label><label>Objectif à atteindre (€)<input name="target" type="number" min="0.01" max="100000000" step="0.01" required value="${a.target}"></label><label>Versement mensuel prévu (€)<input name="monthly" type="number" min="0" max="100000000" step="0.01" required value="${a.monthly}"></label><p id="savingError" role="alert"></p><button class="primary">Enregistrer</button></form>${i!==undefined?`<button class="link" style="width:100%;padding:18px" onclick="modal.close();deleteSaving(${i})">Supprimer cette enveloppe</button>`:''}`);document.querySelector('#savingForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),item={name:f.get('name').trim(),type:f.get('type').trim(),balance:Number(f.get('balance')),target:Number(f.get('target')),monthly:Number(f.get('monthly'))};if(!item.name||!item.type){document.querySelector('#savingError').textContent='Renseignez le nom et le support.';return}if(i===undefined)savings.push(item);else savings[i]=item;modal.close();financeTab='savings';render();toast('Épargne enregistrée')}}
function savingMovement(i){show(`<h2>Mettre à jour mon épargne</h2><p>${esc(savings[i].name)} · Solde ${euros(savings[i].balance)}</p><form id="movementForm"><label>Mouvement<select name="direction"><option value="1">Ajouter à mon épargne</option><option value="-1">Retirer de mon épargne</option></select></label><label>Montant (€)<input name="amount" required type="number" min="0.01" max="100000000" step="0.01"></label><p class="finance-note">Simulation uniquement : aucun virement et aucune modification du compte courant.</p><p id="movementError" role="alert"></p><button class="primary">Enregistrer le mouvement fictif</button></form>`);document.querySelector('#movementForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),balance=Math.round((savings[i].balance+Number(f.get('direction'))*Number(f.get('amount')))*100)/100;if(balance<0){document.querySelector('#movementError').textContent='Le retrait ne peut pas dépasser le solde épargné.';return}savings[i].balance=balance;modal.close();render();toast('Solde actualisé')}}
function deleteSaving(i){show(`<h2>Supprimer cette enveloppe ?</h2><p>${esc(savings[i].name)} sera retirée.</p><button class="primary" onclick="savings.splice(${i},1);modal.close();render()">Confirmer la suppression</button><button class="link" style="width:100%;padding:18px" onclick="modal.close()">Annuler</button>`)}

function moveMonth(delta){const [y,m]=calendarMonth.split('-').map(Number);calendarMonth=localDate(new Date(y,m-1+delta,1)).slice(0,7);selectedDay=calendarMonth+'-01';render()}
function appointmentRow(a){const i=appointments.indexOf(a);return `<button class="row" onclick="editAppointment(${i})"><span class="icon purple">◷</span><span class="grow appointment-title"><strong>${esc(a.title)}</strong><small>${dateFR(a.date)} · ${esc(a.time)}${a.place?' · '+esc(a.place):''}</small></span><span class="chev">›</span></button>`}
const KIND={rdv:'var(--violet)',ech:'var(--amber)',credit:'var(--leaf)'};
function pad2(n){return String(n).padStart(2,'0')}
function creditsOn(date){const month=date.slice(0,7),dim=new Date(Number(date.slice(0,4)),Number(date.slice(5,7)),0).getDate();return credits.filter(c=>c.balance>0&&month>=c.next.slice(0,7)&&month<=c.end.slice(0,7)&&month+'-'+pad2(Math.min(Number(c.next.slice(8)),dim))===date&&date<=c.end)}
function dayKinds(date){const k=[];if(appointments.some(a=>a.date===date))k.push('rdv');if(events.some(e=>!e.done&&e.date===date))k.push('ech');if(creditsOn(date).length)k.push('credit');return k}
function creditRow(c){return `<button class="row" onclick="financeTab='credits';go('finance')"><span class="icon" style="background:var(--leaf-soft);color:var(--leaf-ink)">€</span><span class="grow"><strong>${esc(c.name)}</strong><small>Mensualité · ${esc(c.bank)}</small></span><span class="pill">${euros(c.payment)}</span></button>`}
function upcomingItems(days){const today=localDate(new Date()),end=localDate(new Date(Date.now()+days*864e5)),out=[];appointments.forEach((a,i)=>{if(a.date>=today&&a.date<=end)out.push({k:'rdv',date:a.date,time:a.time,i,a})});events.forEach((e,i)=>{if(!e.done&&e.date>=today&&e.date<=end)out.push({k:'ech',date:e.date,time:'',i,e})});out.sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));return out}
function icsEsc(s){return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n')}
function icsStamp(d){return d.getUTCFullYear()+pad2(d.getUTCMonth()+1)+pad2(d.getUTCDate())+'T'+pad2(d.getUTCHours())+pad2(d.getUTCMinutes())+pad2(d.getUTCSeconds())+'Z'}
function icsLocal(d){return d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+'T'+pad2(d.getHours())+pad2(d.getMinutes())+'00'}
function icsDay(s){return s.replace(/-/g,'')}
function icsNextDay(s){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+1);return icsDay(localDate(d))}
function buildICS(){const stamp=icsStamp(new Date()),out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//PapierZen//Maquette//FR','CALSCALE:GREGORIAN','X-WR-CALNAME:PapierZen'];
const alarm=(trig,txt)=>['BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(txt),'TRIGGER:'+trig,'END:VALARM'];
appointments.forEach((a,i)=>{const s=new Date(a.date+'T'+a.time);if(isNaN(s))return;const e=new Date(s.getTime()+36e5);out.push('BEGIN:VEVENT','UID:pz-rdv-'+i+'-'+icsDay(a.date)+'@papierzen','DTSTAMP:'+stamp,'DTSTART:'+icsLocal(s),'DTEND:'+icsLocal(e),'SUMMARY:'+icsEsc(a.title));if(a.place)out.push('LOCATION:'+icsEsc(a.place));if(a.notes)out.push('DESCRIPTION:'+icsEsc(a.notes));out.push(...alarm('-PT1H','Rendez-vous dans 1 heure'),'END:VEVENT')});
events.forEach((e,i)=>{if(e.done)return;out.push('BEGIN:VEVENT','UID:pz-ech-'+i+'-'+icsDay(e.date)+'@papierzen','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+icsDay(e.date),'DTEND;VALUE=DATE:'+icsNextDay(e.date),'SUMMARY:'+icsEsc('Échéance : '+e.name));if(e.sub)out.push('DESCRIPTION:'+icsEsc(e.sub));const r=e.remind||REMINDS[0];if(r.startsWith('30'))out.push(...alarm('-P30D','Échéance dans 30 jours'));if(r.startsWith('30')||r.startsWith('7'))out.push(...alarm('-P7D','Échéance dans 7 jours'));if(r.startsWith('1'))out.push(...alarm('-P1D','Échéance demain'));out.push('END:VEVENT')});
credits.forEach((c,i)=>{if(c.balance<=0)return;const d=new Date(c.next+'T12:00:00'),dom=Number(c.next.slice(8));for(let n=0;n<12;n++){const y=d.getFullYear(),m=d.getMonth()+n,dim=new Date(y,m+1,0).getDate(),dt=new Date(y,m,Math.min(dom,dim),12),ds=localDate(dt);if(ds>c.end)break;out.push('BEGIN:VEVENT','UID:pz-credit-'+i+'-'+icsDay(ds)+'@papierzen','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+icsDay(ds),'DTEND;VALUE=DATE:'+icsNextDay(ds),'SUMMARY:'+icsEsc('Mensualité '+c.name+' ('+euros(c.payment)+')'),'END:VEVENT')}});
out.push('END:VCALENDAR');return out.join('\r\n')}
function exportICS(){try{const blob=new Blob([buildICS()],{type:'text/calendar;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='papierzen-agenda.ics';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Fichier agenda téléchargé')}catch(e){toast('Export impossible sur cet appareil')}}
function renderCalendar(){const [y,m]=calendarMonth.split('-').map(Number),offset=(new Date(y,m-1,1).getDay()+6)%7,count=new Date(y,m,0).getDate(),today=localDate(new Date());const sorted=[...appointments].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));const daily=sorted.filter(a=>a.date===selectedDay),dayEvents=events.map((e,i)=>({e,i})).filter(({e})=>!e.done&&e.date===selectedDay),dayCredits=creditsOn(selectedDay),up=upcomingItems(30);
app.innerHTML=head('Mon calendrier','Rendez-vous et échéances, réunis au même endroit.')+`<div class="tip"><strong>Un seul agenda, toujours à jour</strong><p>Tout ce que vous ajoutez dans Échéances, dans les rendez-vous, dans vos documents ou dans vos crédits apparaît ici automatiquement, et inversement. Pour l’avoir aussi sur votre téléphone, exportez-le vers Google Agenda, Apple Calendrier ou Outlook.</p></div><div class="finance-actions" style="margin-top:18px"><button class="primary" style="margin-top:0" onclick="editAppointment()">+ Rendez-vous</button><button class="primary" style="margin-top:0;background:var(--amber-btn)" onclick="editEvent()">+ Échéance</button></div><div class="columns"><section><div class="calendar-panel"><div class="calendar-toolbar"><button class="chip" onclick="moveMonth(-1)" aria-label="Mois précédent">‹</button><h2>${monthLabel(calendarMonth)}</h2><button class="chip" onclick="moveMonth(1)" aria-label="Mois suivant">›</button></div><button class="link" style="margin-bottom:12px" onclick="selectedDay=localDate(new Date());calendarMonth=selectedDay.slice(0,7);render()">Aujourd’hui</button><div class="calendar-grid">${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(d=>`<span class="calendar-weekday">${d}</span>`).join('')}${'<span></span>'.repeat(offset)}${Array.from({length:count},(_,i)=>{const date=calendarMonth+'-'+pad2(i+1),ks=dayKinds(date),n=appointments.filter(a=>a.date===date).length+events.filter(e=>!e.done&&e.date===date).length+creditsOn(date).length;return `<button class="calendar-day ${date===selectedDay?'selected':''} ${date===today?'today':''}" aria-pressed="${date===selectedDay}" aria-label="${dateFR(date)}, ${n} élément${n>1?'s':''}" onclick="selectedDay='${date}';render()">${i+1}<small class="dots">${ks.map(k=>`<i style="background:${KEY_COLOR(k,date===selectedDay)}"></i>`).join('')}</small></button>`}).join('')}</div><div class="legend"><span><i style="background:${KIND.rdv}"></i>Rendez-vous</span><span><i style="background:${KIND.ech}"></i>Échéances</span><span><i style="background:${KIND.credit}"></i>Mensualités</span></div></div></section><section style="margin-top:22px"><div class="sectionhead"><h2>${dateFR(selectedDay)}</h2></div>${daily.map(appointmentRow).join('')}${dayEvents.map(({e,i})=>eventRow(e,i)).join('')}${dayCredits.map(creditRow).join('')}${daily.length||dayEvents.length||dayCredits.length?'':'<div class="tip"><strong>Une journée libre</strong><p>Rien de prévu ce jour-là. Ajoutez un rendez-vous ou une échéance avec les boutons ci-dessus.</p></div>'}</section></div><div class="sectionhead" style="margin-top:30px"><h2>Les 30 prochains jours</h2><span class="eyebrow">${up.length} ÉLÉMENT${up.length>1?'S':''}</span></div>${up.map(u=>u.k==='rdv'?appointmentRow(u.a):eventRow(u.e,u.i)).join('')||'<p>Rien de prévu pour le moment.</p>'}<button class="primary" style="background:var(--pine2)" onclick="exportICS()">⇩ Exporter vers mon agenda (.ics)</button><p class="finance-note">Le fichier contient vos rendez-vous, échéances (avec leurs rappels) et mensualités des 12 prochains mois. Il s’importe une fois : refaites l’export après vos modifications.</p><button class="link" style="padding:20px 0" onclick="go('dates')">Voir la liste de mes échéances →</button>`}
function KEY_COLOR(k,sel){return sel?'#fff':KIND[k]}
function editAppointment(i){const a=appointments[i]||{title:'',date:selectedDay,time:'09:00',place:'',notes:''};show(`<span class="eyebrow">MON AGENDA</span><h2 style="margin-top:16px">${i===undefined?'Nouveau rendez-vous':'Modifier le rendez-vous'}</h2><form id="appointmentForm"><label>Objet<input name="title" required maxlength="80" value="${esc(a.title)}" placeholder="Ex. Dentiste, réunion…"></label><div class="finance-grid"><label>Date<input type="date" name="date" required value="${a.date}"></label><label>Heure<input type="time" name="time" required value="${a.time}"></label></div><label>Lieu (facultatif)<input name="place" maxlength="120" value="${esc(a.place)}" placeholder="Adresse ou visioconférence"></label><label>Notes (facultatif)<input name="notes" maxlength="300" value="${esc(a.notes)}" placeholder="À préparer, documents à prendre…"></label><p class="finance-note">Enregistré sur cet appareil, sans notification.</p><p id="appointmentError" role="alert"></p><button class="primary">Enregistrer le rendez-vous</button></form>${i!==undefined?`<button class="link" style="width:100%;padding:18px" onclick="modal.close();deleteAppointment(${i})">Supprimer ce rendez-vous</button>`:''}`);document.querySelector('#appointmentForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),item=Object.fromEntries(f);item.title=item.title.trim();if(!item.title){document.querySelector('#appointmentError').textContent='Indiquez l’objet du rendez-vous.';return}if(i===undefined)appointments.push(item);else appointments[i]=item;selectedDay=item.date;calendarMonth=item.date.slice(0,7);modal.close();go('calendar');toast('Rendez-vous enregistré')}}
function deleteAppointment(i){show(`<h2>Supprimer ce rendez-vous ?</h2><p>${esc(appointments[i].title)}</p><button class="primary" onclick="appointments.splice(${i},1);modal.close();render();toast('Rendez-vous supprimé')">Confirmer la suppression</button><button class="link" style="width:100%;padding:18px" onclick="modal.close()">Annuler</button>`)}

paintTheme();boot();
</script>
</body></html>
