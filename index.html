modal.addEventListener('click',e=>{if(e.target===modal)modal.close()});
function show(html){modal.innerHTML='<button class="close" onclick="modal.close()" aria-label="Fermer">×</button>'+html;modal.setAttribute('tabindex','-1');modal.showModal();modal.focus()}
function toast(t){const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=t;document.body.append(el);setTimeout(()=>el.remove(),3500)}

const DBN='papierzen-files',MAXMB=10;let dbp=null,previewUrl=null;
function db(){if(!dbp)dbp=new Promise((res,rej)=>{try{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return dbp}
function idb(mode,fn){return db().then(d=>new Promise((res,rej)=>{const t=d.transaction('files',mode),r=fn(t.objectStore('files'));t.oncomplete=()=>res(r&&r.result);t.onerror=t.onabort=()=>rej(t.error)}))}
const rawGet=id=>idb('readonly',s=>s.get(id));
const fileGet=id=>rawGet(id).then(v=>openStored(id,v));
const putFile=(id,blob)=>sealBlob(id,blob).then(v=>idb('readwrite',s=>s.put(v,id)));
const fileDel=id=>idb('readwrite',s=>s.delete(id)).catch(()=>{});
function fileIcon(m){return m&&m.type==='application/pdf'?'▤':'▣'}
function sizeLabel(n){return n>1048576?(n/1048576).toFixed(1).replace('.',',')+' Mo':Math.max(1,Math.round(n/1024))+' Ko'}
async function shrinkImage(file){if(!/^image\/(jpeg|png|webp)$/.test(file.type))return file;try{const bmp=await createImageBitmap(file),sc=Math.min(1,1800/Math.max(bmp.width,bmp.height));if(sc===1&&file.size<1.5e6)return file;const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));return b&&b.size<file.size?b:file}catch(e){return file}}
async function storeFile(file){const isPdf=file.type==='application/pdf'||/\.pdf$/i.test(file.name||''),isImg=/^image\//.test(file.type);if(!isPdf&&!isImg)throw new Error('Format non pris en charge : choisissez une photo ou un PDF.');if(file.size>MAXMB*1048576)throw new Error('Fichier trop lourd (maximum '+MAXMB+' Mo).');const blob=isPdf?file:await shrinkImage(file),type=isPdf?'application/pdf':(blob.type||file.type),id='f'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);try{await putFile(id,blob)}catch(e){throw new Error('Enregistrement impossible sur cet appareil (navigation privée ou stockage plein).')}return {id,name:file.name||'document',type,size:blob.size}}
function revokePreview(){if(previewUrl){URL.revokeObjectURL(previewUrl);previewUrl=null}}
modal.addEventListener('close',revokePreview);
function attachmentBlock(){return '<div id="attach"><p class="finance-note">Chargement du fichier…</p></div>'}
async function fillAttachment(meta){const box=document.querySelector('#attach');if(!box)return;try{const blob=await fileGet(meta.id);if(!blob){box.innerHTML='<p class="finance-note">Fichier introuvable sur cet appareil.</p>';return}revokePreview();previewUrl=URL.createObjectURL(blob);const dl=`<a class="chip active" style="flex:1;text-align:center;text-decoration:none" href="${previewUrl}" download="${esc(meta.name)}">⇩ Télécharger</a>`;if(meta.type==='application/pdf'){box.innerHTML=`<div class="tip"><strong>▤ ${esc(meta.name)}</strong><p>PDF · ${sizeLabel(meta.size)}</p></div><div class="finance-actions" style="margin-top:12px"><a class="chip active" style="flex:1;text-align:center;text-decoration:none" href="${previewUrl}" target="_blank" rel="noopener">Ouvrir le PDF</a>${dl}</div>`}else{box.innerHTML=`<img alt="${esc(meta.name)}" src="${previewUrl}" style="width:100%;max-height:50vh;object-fit:contain;border-radius:14px;background:var(--soft);margin-top:14px"><p class="finance-note">${esc(meta.name)} · ${sizeLabel(meta.size)}</p><div class="finance-actions">${dl}</div>`;const im=box.querySelector('img');im.onerror=()=>{im.replaceWith(Object.assign(document.createElement('p'),{className:'finance-note',textContent:'Aperçu indisponible pour ce format : utilisez Télécharger.'}))}}}catch(e){box.innerHTML='<p class="finance-note">Impossible de lire le fichier.</p>'}}
function attachControls(kind,i,has){return has?`<button class="link" style="width:100%;padding:12px" onclick="pickAttach('${kind}',${i})">Remplacer le fichier</button><button class="link" style="width:100%;padding:8px" onclick="removeAttach('${kind}',${i})">Retirer le fichier</button>`:`<button class="primary" style="margin-top:14px;background:var(--pine2)" onclick="pickAttach('${kind}',${i})">+ Joindre une photo ou un PDF</button>`}
function pickAttach(kind,i){const inp=document.createElement('input');inp.type='file';inp.accept='image/*,application/pdf';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;try{const meta=await storeFile(f),t=({doc:docs,pay:payslips,ins:insurances,idn:idents})[kind][i];if(t.att)await fileDel(t.att.id);t.att=meta;if(kind==='doc')t.icon=fileIcon(meta);modal.close();render();toast('Fichier joint');({doc:docDetail,pay:payDetail,ins:insDetail,idn:idDetail})[kind](i)}catch(e){toast(e.message)}};inp.click()}
async function removeAttach(kind,i){const t=({doc:docs,pay:payslips,ins:insurances,idn:idents})[kind][i];if(t.att)await fileDel(t.att.id);t.att=null;if(kind==='doc')t.icon='▤';modal.close();render();toast('Fichier retiré')}
async function doReset(){try{localStorage.removeItem(KEY)}catch(e){}try{if(dbp)(await dbp).close()}catch(e){}try{await new Promise(r=>{const q=indexedDB.deleteDatabase(DBN);q.onsuccess=q.onerror=q.onblocked=()=>r()})}catch(e){}location.reload()}
function resetDemo(){if(cloud){show(`<h2>Effacer cet appareil ?</h2><p>Les données de cet appareil seront supprimées. Elles restent dans votre compte en ligne : vous les retrouverez en vous reconnectant.</p><button class="primary" onclick="wipeLocalAll().then(()=>location.reload())">Effacer cet appareil</button><button class="link" style="width:100%;padding:16px" onclick="modal.close()">Annuler</button>`);return}show(`<h2>Tout effacer ?</h2><p>Toutes vos saisies et tous les fichiers importés sur cet appareil seront supprimés. Vous gardez votre identifiant et votre mot de passe.</p><button class="primary" onclick="doReset()">Tout effacer</button><button class="link" style="width:100%;padding:16px" onclick="modal.close()">Annuler</button>`)}
function docDetail(i){const d=docs[i];show(`<span class="eyebrow">${esc(d.cat)}</span><h2 style="margin-top:18px">${esc(d.name)}</h2><p>${esc(d.sub)}</p>${personSelect('doc',i,d.person)}<div class="tip">${d.date?'Date associée : '+dateFR(d.date):'Aucune échéance associée'}</div>${d.att?attachmentBlock():'<p>Aucun fichier joint à cette fiche.</p>'}${attachControls('doc',i,!!d.att)}${favDetail('docs',i)}<button class="primary" onclick="modal.close();go('dates')">Consulter mes échéances</button><button class="link" style="width:100%;padding:18px" onclick="modal.close();deleteDoc(${i})">Supprimer cette fiche</button>`);if(d.att)fillAttachment(d.att)}
function deleteDoc(i){show(`<h2>Supprimer ce document ?</h2><p>${esc(docs[i].name)}${docs[i].att?' et son fichier joint':''}</p><button class="primary" onclick="removeDoc(${i})">Confirmer la suppression</button><button class="link" style="width:100%;padding:16px" onclick="modal.close()">Annuler</button>`)}
function removeDoc(i){const f=docs[i].att;if(f)fileDel(f.id);docs.splice(i,1);modal.close();render();toast('Document supprimé')}
function delPay(i){const f=payslips[i].att;if(f)fileDel(f.id);payslips.splice(i,1);modal.close();render();toast('Fiche supprimée')}

function eventDetail(i){const e=events[i];show(`<span class="eyebrow">ÉCHÉANCE</span><h2 style="margin-top:16px">${esc(e.name)}</h2><p>${esc(e.sub)}${e.sub?' · ':''}${dateFR(e.date)} · ${e.done?'Terminé':dueLabel(e.date)}</p><label>Me rappeler avant l’échéance<select id="delay">${REMINDS.map(r=>`<option ${r===e.remind?'selected':''}>${r}</option>`).join('')}</select></label><p class="finance-note">Rappel inclus dans l’export de calendrier (.ics). Pas encore de notification dans l’application.</p><button class="primary" onclick="events[${i}].remind=document.querySelector('#delay').value;persist();toast('Rappel enregistré');modal.close()">Tester le rappel</button><button class="link" style="width:100%;padding:16px" onclick="events[${i}].done=!events[${i}].done;modal.close();render()">${e.done?'Remettre à venir':'Marquer comme terminé'}</button><button class="link" style="width:100%;padding:12px" onclick="modal.close();editEvent(${i})">Modifier</button><button class="link" style="width:100%;padding:12px" onclick="modal.close();deleteEvent(${i})">Supprimer</button>`)}
function editEvent(i){const back=page==='calendar'?'calendar':'dates';const e=events[i]||{name:'',sub:'',date:page==='calendar'?selectedDay:localDate(new Date()),icon:'◇',done:false,remind:REMINDS[0]};show(`<span class="eyebrow">MES ÉCHÉANCES</span><h2 style="margin-top:16px">${i===undefined?'Nouvelle échéance':'Modifier l’échéance'}</h2><form id="eventForm"><label>Intitulé<input name="name" required maxlength="70" value="${esc(e.name)}" placeholder="Ex. Vidange, renouvellement mutuelle…"></label><label>Détail (facultatif)<input name="sub" maxlength="90" value="${esc(e.sub)}" placeholder="Ex. Voiture, lave-linge…"></label><label>Date<input type="date" name="date" required value="${e.date}"></label><label>Me rappeler<select name="remind">${REMINDS.map(r=>`<option ${r===e.remind?'selected':''}>${r}</option>`).join('')}</select></label><p class="finance-note">Rappel inclus dans l’export de calendrier (.ics). Pas encore de notification dans l’application.</p><button class="primary">Enregistrer</button></form>`);document.querySelector('#eventForm').onsubmit=ev=>{ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target));f.name=f.name.trim();if(!f.name)return;const item={...e,name:f.name,sub:f.sub.trim(),date:f.date,remind:f.remind};if(i===undefined)events.push(item);else events[i]=item;if(back==='calendar'){selectedDay=item.date;calendarMonth=item.date.slice(0,7)}modal.close();go(back);toast('Échéance enregistrée')}}
function deleteEvent(i){show(`<h2>Supprimer cette échéance ?</h2><p>${esc(events[i].name)}</p><button class="primary" onclick="events.splice(${i},1);modal.close();render();toast('Échéance supprimée')">Confirmer la suppression</button><button class="link" style="width:100%;padding:16px" onclick="modal.close()">Annuler</button>`)}

function addDoc(){if(page==='insurance'){editIns();return}if(page==='ident'){editIdent();return}if(page==='calendar'){editAppointment();return}if(page==='finance'){if(financeTab==='savings')editSaving();else if(financeTab==='credits')editCredit();else editOp();return}if(page==='pay'){addPay();return}if(page==='dates'){editEvent();return}
show(`<span class="eyebrow">UN PAPIER EN MOINS À CHERCHER</span><h2 style="margin-top:16px">Ajouter un document</h2><p>Ajoutez un document avec, si vous voulez, sa photo ou son PDF. Le fichier reste enregistré uniquement sur cet appareil, il n’est envoyé nulle part.</p><form id="form"><label>Nom du document<input required maxlength="70" name="title" placeholder="Ex. Facture du réfrigérateur"></label>${personField('')}<label>Catégorie<select name="cat">${catOptions(page==='tab'&&tabById(curTab)?tabById(curTab).name:'')}</select></label><label>Date d’échéance (facultatif)<input name="date" type="date"></label><label>Photo ou PDF du document (facultatif)<input type="file" name="file" accept="image/*,application/pdf"></label><label>Prendre en photo (facultatif)<input type="file" name="photo" accept="image/*" capture="environment"></label><p id="fileError" role="alert" style="color:var(--red)"></p><button class="primary">Ajouter le document</button></form>`);
document.querySelector('#form select[name=cat]').onchange=e=>{const v=e.target.value;if(v==='Fiches de paie'){modal.close();addPay()}else if(v==='__ident'){modal.close();editIdent()}else if(v==='__insurance'){modal.close();editIns()}};
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),title=f.get('title').trim();if(!title)return;const err=document.querySelector('#fileError'),btn=e.target.querySelector('button');err.textContent='';btn.disabled=true;let meta=null;const chosen=[f.get('file'),f.get('photo')].find(x=>x&&x.size>0);if(chosen){try{meta=await storeFile(chosen)}catch(ex){err.textContent=ex.message;btn.disabled=false;return}}docs.unshift({name:title,person:readPerson(f),cat:f.get('cat'),date:f.get('date'),sub:(meta?(meta.type==='application/pdf'?'PDF ajouté':'Photo ajoutée'):'Document ajouté')+' · '+dateFR(localDate(new Date())),icon:meta?fileIcon(meta):'▤',att:meta});if(f.get('date'))events.push({name:title,sub:'Document · '+f.get('cat'),date:f.get('date'),icon:'▤',done:false,remind:REMINDS[0]});modal.close();filter='Tout';after(page==='tab'?'tab':'docs');toast('Document ajouté')}}

function addPay(){show(`<span class="eyebrow">VIE PROFESSIONNELLE</span><h2 style="margin-top:16px">Ajouter une fiche de paie</h2><p>Joignez votre bulletin en PDF ou en photo. Le fichier reste enregistré uniquement sur cet appareil, il n’est envoyé nulle part.</p><form id="payform"><label>Mois du bulletin<input required type="month" name="month" value="${localDate(new Date()).slice(0,7)}"></label><label>Employeur<input required maxlength="80" name="employer" placeholder="Ex. Nom de votre employeur"></label>${personField('')}<label>PDF ou photo du bulletin (facultatif)<input type="file" name="file" accept="application/pdf,image/*"></label><label>Prendre en photo (facultatif)<input type="file" name="photo" accept="image/*" capture="environment"></label><p id="fileError" role="alert" style="color:var(--red)"></p><button class="primary">Ajouter la fiche de paie</button></form>`);document.querySelector('#payform').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),employer=f.get('employer').trim();if(!employer)return;const err=document.querySelector('#fileError'),btn=e.target.querySelector('button');err.textContent='';btn.disabled=true;let meta=null;const chosen=[f.get('file'),f.get('photo')].find(x=>x&&x.size>0);if(chosen){try{meta=await storeFile(chosen)}catch(ex){err.textContent=ex.message;btn.disabled=false;return}}payslips.push({month:f.get('month'),employer,person:readPerson(f),file:meta?meta.name:'Bulletin-'+f.get('month')+'.pdf',att:meta});modal.close();payYear='Toutes';after('pay');toast('Fiche de paie ajoutée')}}
function payDetail(i){const p=payslips[i];show(`<span class="eyebrow">FICHE DE PAIE</span><h2 style="margin-top:16px">${esc(monthLabel(p.month))}</h2><p>${esc(p.employer)}</p>${personSelect('pay',i,p.person)}${p.att?attachmentBlock():`<div class="tip"><strong>Aucun fichier joint</strong><p style="overflow-wrap:anywhere">${esc(p.file)}</p></div>`}${attachControls('pay',i,!!p.att)}<button class="primary" onclick="modal.close()">Retour à mes bulletins</button><button class="link" style="width:100%;padding:18px" onclick="delPay(${i})">Supprimer cette fiche</button>`);if(p.att)fillAttachment(p.att)}

function defaultScheduleMonth(){const a=credits.filter(c=>c.balance>0).map(c=>c.next.slice(0,7)).sort();return a[0]||localDate(new Date()).slice(0,7)}
function renderCredits(){const active=credits.filter(c=>c.balance>0),total=credits.reduce((s,c)=>s+c.balance,0),monthly=active.reduce((s,c)=>s+c.payment,0),dm=defaultScheduleMonth();app.innerHTML=head('Mes finances','Une vue claire sur vos crédits et vos échéances.')+financeTabs()+`<div class="tip"><strong>Vos crédits, en un coup d’œil</strong><p>Saisie manuelle, sans connexion bancaire. Enregistré sur cet appareil.</p></div><div class="stats finance-stats" style="margin-top:22px"><div class="stat"><span>Capital restant à rembourser</span><strong style="margin-top:10px">${euros(total)}</strong><span>Hors intérêts et assurance à venir</span></div><div class="stat"><span>Mensualités cumulées</span><strong style="margin-top:10px">${euros(monthly)}</strong><span>par mois</span></div><div class="stat"><span>Crédits en cours</span><strong style="margin-top:10px">${String(active.length).padStart(2,'0')}</strong><span>à suivre au même endroit</span></div></div><div class="sectionhead"><h2>Mes crédits</h2><button class="chip active" onclick="editCredit()">+ Ajouter</button></div><div class="columns"><section>${credits.map((c,i)=>{const pct=Math.max(0,Math.min(100,(1-c.balance/c.initial)*100));return `<article class="credit-card"><button class="row" onclick="creditDetail(${i})"><span class="icon ${i%2?'purple':'amber'}">€</span><span class="grow"><strong>${esc(c.name)}</strong><small>${esc(c.bank)}</small></span><span class="chev">›</span></button><div class="sectionhead" style="margin-top:24px"><div><div class="eyebrow">RESTE À REMBOURSER</div><h2 style="margin-top:8px">${euros(c.balance)}</h2></div><div style="text-align:right"><strong>${euros(c.balance>0?c.payment:0)}</strong><small style="display:block;color:var(--muted);margin-top:6px">/ mois</small></div></div><div class="credit-progress" role="progressbar" aria-label="Capital remboursé" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}"><span style="width:${pct}%"></span></div><p class="finance-note">${Math.round(pct)} % remboursés · Montant initial ${euros(c.initial)}</p><p class="finance-note">${c.balance>0?'Prochaine échéance : '+dateFR(c.next):'Crédit soldé ✓'}</p><button class="link" style="padding:8px 0" onclick="creditDetail(${i})">Voir le détail →</button></article>`}).join('')||'<div class="empty">Aucun crédit. Ajoutez votre première fiche.</div>'}</section><section><div class="sectionhead"><h2>Prochaines échéances</h2></div><label for="financeMonth">Mois à consulter</label><input id="financeMonth" class="search" style="margin-top:8px" type="month" value="${dm}" onchange="renderSchedule(this.value)"><div id="financeSchedule"></div><div class="tip"><strong>Le solde de référence</strong><p>Reportez le capital restant dû indiqué sur votre dernier relevé bancaire. Une mensualité inclut parfois des intérêts et une assurance : elle ne réduit pas intégralement le capital.</p></div></section></div>`;renderSchedule(dm)}
function renderSchedule(month){const target=document.querySelector('#financeSchedule');if(!target)return;if(!/^\d{4}-\d{2}$/.test(month)){target.innerHTML='<p>Sélectionnez un mois.</p>';return}const [y,m]=month.split('-').map(Number);const items=credits.filter(c=>c.balance>0&&month>=c.next.slice(0,7)&&month<=c.end.slice(0,7)).map(c=>{const day=Math.min(Number(c.next.slice(8)),new Date(y,m,0).getDate());return {c,date:month+'-'+String(day).padStart(2,'0')}}).filter(x=>x.date<=x.c.end).sort((a,b)=>a.date.localeCompare(b.date));target.innerHTML=`<p class="finance-note">Échéances mensuelles prévues · ${euros(items.reduce((s,x)=>s+x.c.payment,0))}</p>`+items.map(({c,date})=>`<div class="schedule"><time datetime="${date}">${esc(dateFR(date).replace(/ \d{4}$/,''))}</time><div class="grow"><strong>${esc(c.name)}</strong><small>${esc(c.bank)}</small></div><strong>${euros(c.payment)}</strong></div>`).join('')+(items.length?'':'<p class="empty">Aucune échéance prévue pour ce mois.</p>')+'<p class="finance-note">Projection à mensualité constante selon les dates saisies. Dernière échéance à confirmer sur votre relevé.</p>'}

function editCredit(i){const c=credits[i]||{name:'',bank:'',initial:'',balance:'',payment:'',next:localDate(new Date()),end:''};show(`<span class="eyebrow">MES FINANCES</span><h2 style="margin-top:16px">${i===undefined?'Ajouter un crédit':'Modifier le crédit'}</h2><p>Saisie manuelle, enregistrée uniquement sur cet appareil.</p><form id="creditForm"><label>Nom du crédit<input name="name" required maxlength="70" value="${esc(c.name)}" placeholder="Ex. Crédit auto"></label><label>Banque ou organisme<input name="bank" required maxlength="70" value="${esc(c.bank)}"></label><div class="finance-grid"><label>Montant emprunté (€)<input name="initial" required type="number" min="0.01" max="100000000" step="0.01" value="${c.initial}"></label><label>Capital restant dû (€)<input name="balance" required type="number" min="0" max="100000000" step="0.01" value="${c.balance}"></label><label>Mensualité totale (€)<input name="payment" required type="number" min="0.01" max="100000000" step="0.01" value="${c.payment}"></label><label>Prochaine échéance<input name="next" required type="date" value="${c.next}"></label><label>Date de fin prévue<input name="end" required type="date" value="${c.end}"></label></div><p id="creditError" role="alert" style="color:var(--red)"></p><button class="primary">Enregistrer la fiche</button></form>`);document.querySelector('#creditForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const n={name:f.get('name').trim(),bank:f.get('bank').trim(),initial:Number(f.get('initial')),balance:Number(f.get('balance')),payment:Number(f.get('payment')),next:f.get('next'),end:f.get('end')};const error=!n.name||!n.bank?'Renseignez le nom et l’organisme.':n.balance>n.initial?'Le capital restant dû ne peut pas dépasser le montant emprunté.':n.end<n.next?'La date de fin doit être égale ou postérieure à la prochaine échéance.':'';if(error){document.querySelector('#creditError').textContent=error;return}if(i===undefined)credits.push(n);else credits[i]=keepU(credits[i],n);modal.close();financeTab='credits';go('finance');toast('Crédit enregistré')}}

/* --- Accueil personnalisable : rubriques d'origine + onglets créés, renommables, réordonnables, masquables --- */
const SEC_DEF={pay:{label:'Mes fiches de paie',icon:'▤',cls:'purple'},finance:{label:'Mes finances',icon:'€',cls:'amber'},insurance:{label:'Mes assurances',icon:'♡',cls:'amber'},people:{label:'Mes proches',icon:'☺',cls:'purple'},ident:{label:'Mes papiers d’identité',icon:'▭',cls:''},calendar:{label:'Mon calendrier',icon:'▦',cls:'purple'}};
function secLabel(k){const l=layout.labels&&layout.labels[k];return l||SEC_DEF[k].label}
function sectionKeys(){const keys=[...Object.keys(SEC_DEF),...tabs.map(t=>'t:'+t._u)],out=[];for(const k of layout.order||[])if(keys.includes(k)&&!out.includes(k))out.push(k);for(const k of keys)if(!out.includes(k))out.push(k);return out}
function secInfo(k){if(k.startsWith('t:')){const t=tabById(k.slice(2));return t?{key:k,label:t.name,icon:t.icon||'▤',custom:true,t}:null}return SEC_DEF[k]?{key:k,label:secLabel(k),icon:SEC_DEF[k].icon,custom:false}:null}
function secRow(k){const s=secInfo(k);if(!s)return '';const row=(go_,cls,sub)=>`<button class="row" onclick="${go_}"><span class="icon ${cls}">${esc(s.icon)}</span><span class="grow"><strong>${esc(s.label)}</strong><small>${sub}</small></span><span class="chev">›</span></button>`;
if(s.custom){const n=tabDocs(s.t).length;return row("openTab('"+s.t._u+"')",'',n+' document'+(n>1?'s':''))}
switch(k){case 'pay':return row("go('pay')",'purple','Vos bulletins, classés par année et par mois');case 'finance':return row("go('finance')",'amber','Budget, crédits et épargne · '+euros(savings.reduce((a,x)=>a+x.balance,0))+' mis de côté');
case 'insurance':return row("go('insurance')",'amber',insurances.length+' contrat'+(insurances.length>1?'s':'')+' · '+euros(insurances.reduce((t,a)=>t+insYear(a),0))+' par an');case 'people':return row("go('people')",'purple',people.length+' personne'+(people.length>1?'s':'')+' · Tout regrouper par personne');
case 'ident':return row("go('ident')",'',idents.length+' papier'+(idents.length>1?'s':'')+' · '+identNextLabel());case 'calendar':{const na=nextAppointment();return row("go('calendar')",'purple',na?'Prochain : '+esc(na.title)+' · '+dateFR(na.date)+' à '+esc(na.time):'Mes rendez-vous et mon agenda du mois')}}return ''}
function homeSections(){const hid=layout.hidden||[];return sectionKeys().filter(k=>!hid.includes(k)).map(secRow).join('')+`<div class="finance-actions" style="margin:8px 0 26px"><button class="chip" onclick="editTab()">+ Nouvel onglet</button><button class="chip" onclick="customizeHome()">✎ Personnaliser l’accueil</button></div>`}
let cuDraft=null;
function customizeHome(){cuDraft={order:sectionKeys(),hidden:[...(layout.hidden||[])],names:{}};paintCustomize()}
function paintCustomize(){const d=cuDraft,keys=d.order;show(`<span class="eyebrow">MON ACCUEIL</span><h2 style="margin-top:16px">Personnaliser l’accueil</h2><p>Renommez, réordonnez ou masquez les rubriques. Masquer ne supprime rien : les documents restent dans leur onglet et dans la recherche.</p><form id="cuForm">${keys.map((k,n)=>{const s=secInfo(k);if(!s)return '';const nm=d.names[k]!==undefined?d.names[k]:s.label,on=!d.hidden.includes(k);return `<div style="margin:12px 0;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface)"><input value="${esc(nm)}" maxlength="30" aria-label="Nom de la rubrique" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)" oninput="cuDraft.names['${k}']=this.value"><div class="rw" style="gap:8px;margin-top:8px;justify-content:flex-end"><button type="button" class="chip" ${n===0?'disabled':''} onclick="cuMove('${k}',-1)" aria-label="Monter">▲</button><button type="button" class="chip" ${n===keys.length-1?'disabled':''} onclick="cuMove('${k}',1)" aria-label="Descendre">▼</button><button type="button" class="star ${on?'on':''}" style="font-size:19px" aria-pressed="${on}" aria-label="${on?'Masquer':'Afficher'} cette rubrique" onclick="cuToggle('${k}')">${on?'👁':'∅'}</button></div></div>`}).join('')}<p id="cuErr" role="alert" style="color:var(--red)"></p><button class="primary">Enregistrer</button></form><button class="link" style="width:100%;padding:14px" onclick="resetHome()">Rétablir l’ordre et les noms d’origine</button>`);
document.querySelector('#cuForm').onsubmit=e=>{e.preventDefault();saveCustomize()}}
function cuMove(k,dir){const o=cuDraft.order,i=o.indexOf(k),j=i+dir;if(i<0||j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];paintCustomize()}
function cuToggle(k){const h=cuDraft.hidden,i=h.indexOf(k);if(i>=0)h.splice(i,1);else h.push(k);paintCustomize()}
function saveCustomize(){const d=cuDraft,err=document.querySelector('#cuErr'),labels={...(layout.labels||{})},renames=[];
for(const k of d.order){const s=secInfo(k);if(!s)continue;let nm=d.names[k];if(nm===undefined)continue;nm=nm.trim().replace(/\s+/g,' ');if(!nm){err.textContent='Un nom ne peut pas être vide.';return}
if(s.custom){if(nm!==s.t.name){const low=nm.toLowerCase();if(TAB_BUILTIN.includes(low)||tabs.some(x=>x._u!==s.t._u&&x.name.toLowerCase()===low)||renames.some(r=>r.nm.toLowerCase()===low)){err.textContent='« '+nm+' » existe déjà. Choisissez un autre nom.';return}renames.push({t:s.t,nm})}}
else{if(nm===SEC_DEF[k].label)delete labels[k];else labels[k]=nm}}
renames.forEach(({t,nm})=>{const old=t.name;t.name=nm;docs.forEach(x=>{if(x.cat===old)x.cat=nm})});
layout={order:d.order.slice(),hidden:d.hidden.slice(),labels};cuDraft=null;modal.close();render();toast('Accueil enregistré')}
function resetHome(){layout={order:[],hidden:[],labels:{}};cuDraft=null;modal.close();render();toast('Accueil rétabli')}
/* --- Recherche globale : documents, fiches de paie, papiers, assurances, échéances… --- */
const MONTHS_FR=['janvier','fevrier','mars','avril','mai','juin','juillet','aout','septembre','octobre','novembre','decembre'];
function nrm(s){return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’'`]/g,' ').replace(/[^a-z0-9]+/g,' ').trim()}
function dateWords(iso){const m=String(iso||'').match(/^(\d{4})-(\d{2})(?:-(\d{2}))?/);if(!m)return '';const mo=+m[2];return MONTHS_FR[mo-1]+' '+m[1]+' '+m[1]+' '+m[2]+' '+m[2]+' '+m[1]+(m[3]?' '+(+m[3]):'')}
function lev(a,b,max){if(Math.abs(a.length-b.length)>max)return max+1;let prev=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){const cur=[i];let min=i;for(let j=1;j<=b.length;j++){const v=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));cur.push(v);if(v<min)min=v}if(min>max)return max+1;prev=cur}return prev[b.length]}
function tokenScore(tok,words){let best=0;for(const w of words){if(w===tok){best=Math.max(best,4);continue}if(tok.length>=2&&w.startsWith(tok)){best=Math.max(best,3);continue}if(tok.length>=3&&w.includes(tok)){best=Math.max(best,2);continue}if(tok.length>=4&&w.length>=4){const d=lev(tok,w,tok.length>=7?2:1);if(d<=(tok.length>=7?2:1))best=Math.max(best,1);else if(w.length>=5&&tok.startsWith(w))best=Math.max(best,1)}}return best}

function buildICS(){const stamp=icsStamp(new Date()),out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//PapierZen//FR','CALSCALE:GREGORIAN','X-WR-CALNAME:PapierZen'];

events.forEach((e,i)=>{if(e.done)return;out.push('BEGIN:VEVENT','UID:pz-ech-'+icsHash(e.name+'|'+(e.sub||'')+'|'+e.date)+'@papierzen','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+icsDay(e.date),'DTEND;VALUE=DATE:'+icsNextDay(e.date),'SUMMARY:'+icsEsc('Échéance : '+e.name));if(e.sub)out.push('DESCRIPTION:'+icsEsc(e.sub));const r=e.remind||REMINDS[0];if(r.startsWith('30'))out.push(...alarm('-P29DT15H','Échéance dans 30 jours'));if(r.startsWith('30')||r.startsWith('7'))out.push(...alarm('-P6DT15H','Échéance dans 7 jours'));if(r.startsWith('1'))out.push(...alarm('-PT15H','Échéance demain'));out.push('END:VEVENT')});
credits.forEach((c,i)=>{if(c.balance<=0)return;const d=new Date(c.next+'T12:00:00'),dom=Number(c.next.slice(8));for(let n=0;n<12;n++){const y=d.getFullYear(),m=d.getMonth()+n,dim=new Date(y,m+1,0).getDate(),dt=new Date(y,m,Math.min(dom,dim),12),ds=localDate(dt);if(ds>c.end)break;out.push('BEGIN:VEVENT','UID:pz-credit-'+icsHash(c.name+'|'+c.bank)+'-'+icsDay(ds)+'@papierzen','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+icsDay(ds),'DTEND;VALUE=DATE:'+icsNextDay(ds),'SUMMARY:'+icsEsc('Mensualité '+c.name+' ('+euros(c.payment)+')'),'END:VEVENT')}});

function renderCalendar(){const [y,m]=calendarMonth.split('-').map(Number),offset=(new Date(y,m-1,1).getDay()+6)%7,count=new Date(y,m,0).getDate(),today=localDate(new Date());const sorted=[...appointments].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));const daily=sorted.filter(a=>a.date===selectedDay),dayEvents=events.map((e,i)=>({e,i})).filter(({e})=>!e.done&&e.date===selectedDay),dayCredits=creditsOn(selectedDay),up=upcomingItems(30);
app.innerHTML=head('Mon calendrier','Rendez-vous et échéances, réunis au même endroit.')+`<div class="tip"><strong>Un seul agenda, toujours à jour</strong><p>Tout ce que vous ajoutez dans Échéances, dans les rendez-vous, dans vos documents ou dans vos crédits apparaît ici automatiquement, et inversement. Pour l’avoir aussi sur votre téléphone, exportez-le vers Google Agenda, Apple Calendrier ou Outlook.</p></div><div class="finance-actions" style="margin-top:18px"><button class="primary" style="margin-top:0" onclick="editAppointment()">+ Rendez-vous</button><button class="primary" style="margin-top:0;background:var(--amber-btn)" onclick="editEvent()">+ Échéance</button></div><div class="columns"><section><div class="calendar-panel"><div class="calendar-toolbar"><button class="chip" onclick="moveMonth(-1)" aria-label="Mois précédent">‹</button><h2>${monthLabel(calendarMonth)}</h2><button class="chip" onclick="moveMonth(1)" aria-label="Mois suivant">›</button></div><button class="link" style="margin-bottom:12px" onclick="selectedDay=localDate(new Date());calendarMonth=selectedDay.slice(0,7);render()">Aujourd’hui</button><div class="calendar-grid">${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(d=>`<span class="calendar-weekday">${d}</span>`).join('')}${'<span></span>'.repeat(offset)}${Array.from({length:count},(_,i)=>{const date=calendarMonth+'-'+pad2(i+1),ks=dayKinds(date),n=appointments.filter(a=>a.date===date).length+events.filter(e=>!e.done&&e.date===date).length+creditsOn(date).length;return `<button class="calendar-day ${date===selectedDay?'selected':''} ${date===today?'today':''}" aria-pressed="${date===selectedDay}" aria-label="${dateFR(date)}, ${n} élément${n>1?'s':''}" onclick="selectedDay='${date}';render()">${i+1}<small class="dots">${ks.map(k=>`<i style="background:${KEY_COLOR(k,date===selectedDay)}"></i>`).join('')}</small></button>`}).join('')}</div><div class="legend"><span><i style="background:${KIND.rdv}"></i>Rendez-vous</span><span><i style="background:${KIND.ech}"></i>Échéances</span><span><i style="background:${KIND.credit}"></i>Mensualités</span></div></div></section><section style="margin-top:22px"><div class="sectionhead"><h2>${dateFR(selectedDay)}</h2></div>${daily.map(appointmentRow).join('')}${dayEvents.map(({e,i})=>eventRow(e,i)).join('')}${dayCredits.map(creditRow).join('')}${daily.length||dayEvents.length||dayCredits.length?'':'<div class="tip"><strong>Une journée libre</strong><p>Rien de prévu ce jour-là. Ajoutez un rendez-vous ou une échéance avec les boutons ci-dessus.</p></div>'}</section></div><div class="sectionhead" style="margin-top:30px"><h2>Les 30 prochains jours</h2><span class="eyebrow">${up.length} ÉLÉMENT${up.length>1?'S':''}</span></div>${up.map(u=>u.k==='rdv'?appointmentRow(u.a):eventRow(u.e,u.i)).join('')||'<p>Rien de prévu pour le moment.</p>'}<button class="primary" style="background:var(--pine2)" onclick="exportICS()">⇩ Exporter vers mon agenda (.ics)</button><p class="finance-note">Le fichier contient vos rendez-vous, échéances (avec leurs rappels) et mensualités des 12 prochains mois. Il s’importe une fois : refaites l’export après vos modifications. Les rappels (à 9 h pour les échéances) sont appliqués par Apple Calendrier et Outlook ; Google Agenda les ignore souvent à l’import et utilise vos rappels par défaut.</p><button class="link" style="padding:20px 0" onclick="go('dates')">Voir la liste de mes échéances →</button>`}
function KEY_COLOR(k,sel){return sel?'#fff':KIND[k]}
function editAppointment(i){const a=appointments[i]||{title:'',date:selectedDay,time:'09:00',place:'',notes:''};show(`<span class="eyebrow">MON AGENDA</span><h2 style="margin-top:16px">${i===undefined?'Nouveau rendez-vous':'Modifier le rendez-vous'}</h2><form id="appointmentForm"><label>Objet<input name="title" required maxlength="80" value="${esc(a.title)}" placeholder="Ex. Dentiste, réunion…"></label><div class="finance-grid"><label>Date<input type="date" name="date" required value="${a.date}"></label><label>Heure<input type="time" name="time" required value="${a.time}"></label></div><label>Lieu (facultatif)<input name="place" maxlength="120" value="${esc(a.place)}" placeholder="Adresse ou visioconférence"></label><label>Notes (facultatif)<input name="notes" maxlength="300" value="${esc(a.notes)}" placeholder="À préparer, documents à prendre…"></label><p class="finance-note">Enregistré sur cet appareil, sans notification.</p><p id="appointmentError" role="alert"></p><button class="primary">Enregistrer le rendez-vous</button></form>${i!==undefined?`<button class="link" style="width:100%;padding:18px" onclick="modal.close();deleteAppointment(${i})">Supprimer ce rendez-vous</button>`:''}`);document.querySelector('#appointmentForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),item=Object.fromEntries(f);item.title=item.title.trim();if(!item.title){document.querySelector('#appointmentError').textContent='Indiquez l’objet du rendez-vous.';return}if(i===undefined)appointments.push(item);else appointments[i]=keepU(appointments[i],item);selectedDay=item.date;calendarMonth=item.date.slice(0,7);modal.close();go('calendar');toast('Rendez-vous enregistré')}}
function deleteAppointment(i){show(`<h2>Supprimer ce rendez-vous ?</h2><p>${esc(appointments[i].title)}</p><button class="primary" onclick="appointments.splice(${i},1);modal.close();render();toast('Rendez-vous supprimé')">Confirmer la suppression</button><button class="link" style="width:100%;padding:18px" onclick="modal.close()">Annuler</button>`)}

addEventListener('keydown',e=>{if(!unlocked||modal.open)return;const tag=(document.activeElement&&document.activeElement.tagName)||'';if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchModal()}else if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(tag)){e.preventDefault();searchModal()}});
paintTheme();boot();
</script>
</body></html>
